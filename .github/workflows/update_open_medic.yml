name: Update Open Medic report

on:
  workflow_dispatch:
  schedule:
    # Tous les 1er janvier et 1er juillet à 06h00 UTC
    - cron: "0 6 1 1,7 *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  update-report:
    name: Build Open Medic report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Setup R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::janitor
            any::scales
            any::sf
            any::rnaturalearth
            any::rnaturalearthdata
            any::mapsf
            any::treemapify
            any::patchwork
            any::rmarkdown
            any::knitr
            any::stringr
            any::glue
            any::pagedown

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Open Medic pipeline
        run: Rscript scripts/00_run_all.R

      - name: Commit updated report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Open Medic report"
          file_pattern: "config.R docs/* outputs/figures/* outputs/tableaux/* data/processed/*"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy-pages:
    name: Deploy GitHub Pages
    needs: update-report
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
